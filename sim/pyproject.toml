[project]
name = "finpay-sim"
version = "0.1.0"
description = "NovaPay sandbox: payments, banks A–E, OTP P1/P2, chaos and admin (sandbox only)"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi[standard]>=0.150", "pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
