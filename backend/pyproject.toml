[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel: agentic AIOps for NovaPay (PS-02)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard]>=0.150",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6",
  "numpy>=2.1",
  "pandas>=2.2",
  "scipy>=1.14",
  "openai>=2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
