[project]
name = "sentinel"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "pyyaml",
  "numpy",
  "scipy",
  "pandas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]
